<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0b0f">
<title>Зачёт EN</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0b0f;
  --s1: #111318;
  --s2: #181b23;
  --s3: #1e2230;
  --border: #ffffff0f;
  --border2: #ffffff18;
  --text: #f0f2f8;
  --text2: #8b91a8;
  --text3: #4a5068;
  --blue: #4f8fff;
  --blue-glow: rgba(79,143,255,0.18);
  --purple: #9b6fff;
  --purple-glow: rgba(155,111,255,0.18);
  --amber: #f5a623;
  --amber-glow: rgba(245,166,35,0.16);
  --green: #3ecf8e;
  --green-glow: rgba(62,207,142,0.16);
  --red: #ff5f5f;
  --red-glow: rgba(255,95,95,0.16);
  --sans: 'Inter', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; background:var(--bg); }
body { font-family:var(--sans); color:var(--text); }

/* ── SCREENS ── */
.screen { position:fixed; inset:0; display:flex; flex-direction:column; opacity:0; pointer-events:none; transition:opacity .25s ease; }
.screen.active { opacity:1; pointer-events:all; }

/* ── HOME ── */
#home { background:var(--bg); overflow-y:auto; padding-bottom:88px; }
.home-bg {
  position:absolute; top:0; left:0; right:0; height:260px;
  background:radial-gradient(ellipse 80% 60% at 50% -10%, rgba(79,143,255,0.12) 0%, transparent 70%);
  pointer-events:none;
}
.home-head { padding:56px 24px 32px; position:relative; }
.home-head .greeting { font-size:13px; font-weight:600; color:var(--blue); letter-spacing:.5px; margin-bottom:8px; }
.home-head h1 { font-size:30px; font-weight:900; line-height:1.15; letter-spacing:-.5px; }
.home-head h1 .dim { color:var(--text2); font-weight:700; }
.home-head .sub { font-size:13px; color:var(--text2); margin-top:10px; line-height:1.6; }

.topics-grid { padding:0 16px; display:flex; flex-direction:column; gap:12px; position:relative; }

.t-card {
  border-radius:20px; padding:22px 20px; cursor:pointer; position:relative; overflow:hidden;
  border:1px solid var(--border2); background:var(--s1);
  transition:transform .15s, background .15s;
  display:flex; align-items:center; gap:16px;
}
.t-card:active { transform:scale(.97); }
.t-card .t-glow {
  position:absolute; inset:0; opacity:.5;
  transition:opacity .3s;
}
.t-card:nth-child(1) .t-glow { background:radial-gradient(ellipse at 0% 50%, rgba(79,143,255,0.15) 0%, transparent 60%); }
.t-card:nth-child(2) .t-glow { background:radial-gradient(ellipse at 0% 50%, rgba(255,95,95,0.12) 0%, transparent 60%); }
.t-card:nth-child(3) .t-glow { background:radial-gradient(ellipse at 0% 50%, rgba(62,207,142,0.12) 0%, transparent 60%); }
.t-card:nth-child(4) .t-glow { background:radial-gradient(ellipse at 0% 50%, rgba(245,166,35,0.12) 0%, transparent 60%); }

.t-emoji { font-size:32px; flex-shrink:0; position:relative; z-index:1; }
.t-info { flex:1; min-width:0; position:relative; z-index:1; }
.t-title { font-size:16px; font-weight:800; letter-spacing:-.2px; margin-bottom:5px; }
.t-card:nth-child(1) .t-title { color:#7aabff; }
.t-card:nth-child(2) .t-title { color:#ff8080; }
.t-card:nth-child(3) .t-title { color:#5fdba8; }
.t-card:nth-child(4) .t-title { color:#f5c060; }
.t-meta { font-size:12px; color:var(--text2); }
.t-prog-bar { height:3px; background:rgba(255,255,255,.07); border-radius:100px; margin-top:8px; overflow:hidden; width:100%; }
.t-prog-fill { height:100%; border-radius:100px; transition:width .5s ease; }
.t-card:nth-child(1) .t-prog-fill { background:var(--blue); }
.t-card:nth-child(2) .t-prog-fill { background:var(--red); }
.t-card:nth-child(3) .t-prog-fill { background:var(--green); }
.t-card:nth-child(4) .t-prog-fill { background:var(--amber); }
.t-arrow { font-size:18px; color:var(--text3); flex-shrink:0; position:relative; z-index:1; }

/* ── TRAINER ── */
#trainer {
  background:var(--bg); flex-direction:column;
}
.trainer-head {
  padding:52px 20px 14px;
  display:flex; align-items:center; gap:12px; flex-shrink:0;
}
.tr-back {
  width:38px; height:38px; border-radius:12px;
  background:var(--s1); border:1px solid var(--border2);
  color:var(--text2); font-size:18px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0;
}
.tr-back:active { background:var(--s2); }
.tr-topic { flex:1; min-width:0; }
.tr-topic-name { font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tr-topic-sub { font-size:11px; color:var(--text2); margin-top:1px; }
.tr-read-btn {
  padding:6px 12px; border-radius:8px; background:var(--s1);
  border:1px solid var(--border2); font-size:11px; font-weight:700;
  color:var(--text2); cursor:pointer; flex-shrink:0;
}

/* Progress strip */
.tr-prog-strip {
  padding:0 20px 14px; flex-shrink:0;
}
.tr-prog-nums { display:flex; justify-content:space-between; margin-bottom:6px; }
.tr-prog-nums span { font-size:11px; color:var(--text2); font-weight:600; }
.tr-prog-nums .pn-val { color:var(--text); font-weight:700; }
.big-bar { height:6px; background:rgba(255,255,255,.06); border-radius:100px; overflow:hidden; }
.big-fill { height:100%; background:linear-gradient(90deg, var(--blue), var(--purple)); border-radius:100px; transition:width .5s ease; }

/* Stage indicators */
.stages-track { display:flex; gap:5px; padding:0 20px 16px; flex-shrink:0; }
.stage-pip { flex:1; height:4px; border-radius:100px; background:rgba(255,255,255,.07); transition:background .4s, transform .2s; }
.stage-pip.s-done { background:var(--green); }
.stage-pip.s-cur-0 { background:var(--purple); transform:scaleY(1.5); }
.stage-pip.s-cur-1 { background:var(--amber); transform:scaleY(1.5); }
.stage-pip.s-cur-2 { background:var(--blue); transform:scaleY(1.5); }
.stage-pip.s-cur-3 { background:var(--text); transform:scaleY(1.5); }

/* Main card */
.tr-card-wrap {
  flex:1; padding:0 16px; display:flex; flex-direction:column; gap:10px;
  overflow:hidden; min-height:0;
}

/* Previous sentence ghost */
.prev-ghost {
  padding:12px 16px; border-radius:14px;
  background:rgba(255,255,255,.03); border:1px solid var(--border);
  flex-shrink:0;
}
.prev-ghost .pg-label { font-size:9px; font-weight:700; letter-spacing:1.5px; color:var(--text3); text-transform:uppercase; margin-bottom:5px; }
.prev-ghost .pg-text { font-size:13px; color:var(--text3); line-height:1.5; }
.prev-ghost .pg-text strong { color:rgba(79,143,255,.45); font-weight:700; }

/* The main learning card */
.tr-card {
  flex:1; border-radius:24px; border:1px solid var(--border2);
  padding:28px 22px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
  position:relative; overflow:hidden; min-height:0;
  transition:border-color .4s;
}
.tr-card .card-glow {
  position:absolute; inset:0; pointer-events:none;
  transition:opacity .4s;
}
/* Stage colors */
.tr-card.st-read  { border-color:rgba(155,111,255,.3); background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(155,111,255,.07) 0%, transparent 70%), var(--s1); }
.tr-card.st-ru    { border-color:rgba(245,166,35,.3);  background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(245,166,35,.07) 0%, transparent 70%), var(--s1); }
.tr-card.st-anc   { border-color:rgba(79,143,255,.3);  background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(79,143,255,.08) 0%, transparent 70%), var(--s1); }
.tr-card.st-blank { border-color:rgba(255,255,255,.12); background:var(--s1); }

.stage-badge {
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 13px; border-radius:100px; font-size:10px; font-weight:800;
  letter-spacing:.8px; text-transform:uppercase; margin-bottom:20px; flex-shrink:0;
}
.sb-read  { background:var(--purple-glow); color:var(--purple); border:1px solid rgba(155,111,255,.25); }
.sb-ru    { background:var(--amber-glow);  color:var(--amber);  border:1px solid rgba(245,166,35,.25); }
.sb-anc   { background:var(--blue-glow);   color:var(--blue);   border:1px solid rgba(79,143,255,.25); }
.sb-blank { background:rgba(255,255,255,.05); color:var(--text2); border:1px solid var(--border2); }

.card-content { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; min-height:0; }

.full-en { font-size:17px; font-weight:700; line-height:1.7; color:var(--text); }
.full-en strong { color:#7aabff; font-weight:800; }
.full-ru { font-size:14px; font-weight:500; line-height:1.6; color:var(--text2); margin-top:14px; }
.full-ru strong { color:rgba(155,111,255,.8); font-weight:700; }

.ru-only { font-size:16px; font-weight:600; line-height:1.7; color:var(--text); }
.ru-only strong { color:rgba(245,166,35,.85); font-weight:700; }

.anchors-wrap { display:flex; flex-wrap:wrap; gap:9px; justify-content:center; }
.anc-pill {
  padding:8px 16px; border-radius:100px;
  background:var(--blue-glow); border:1px solid rgba(79,143,255,.3);
  font-size:15px; font-weight:700; color:var(--blue);
}

.blank-num { font-size:72px; font-weight:900; color:rgba(255,255,255,.06); letter-spacing:-3px; line-height:1; }
.blank-sub { font-size:13px; color:var(--text3); margin-top:12px; font-weight:500; }

/* Reveal answer */
.reveal-box {
  width:100%; margin-top:16px; padding-top:16px;
  border-top:1px solid var(--border2); display:none; text-align:center;
}
.reveal-box.show { display:block; }
.reveal-en { font-size:16px; font-weight:700; line-height:1.7; color:var(--text); }
.reveal-en strong { color:#7aabff; font-weight:800; }
.reveal-ru { font-size:13px; color:var(--text2); line-height:1.5; margin-top:8px; }
.reveal-ru strong { color:rgba(155,111,255,.7); font-weight:700; }

.card-tap-hint { font-size:11px; color:var(--text3); margin-top:16px; font-weight:500; flex-shrink:0; }

/* Action buttons */
.tr-actions { padding:12px 16px 20px; display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
.action-btn {
  width:100%; padding:17px 20px; border-radius:16px; font-size:15px; font-weight:700;
  font-family:var(--sans); cursor:pointer; border:none; transition:opacity .15s, transform .1s;
  letter-spacing:-.1px;
}
.action-btn:active { opacity:.8; transform:scale(.98); }
.btn-primary { background:linear-gradient(135deg, var(--blue), #6a5aff); color:#fff; }
.btn-check   { background:var(--s2); border:1px solid var(--border2); color:var(--text); }
.btn-wrong   { background:var(--red-glow); border:1px solid rgba(255,95,95,.3); color:var(--red); }
.btn-right   { background:var(--green-glow); border:1px solid rgba(62,207,142,.3); color:var(--green); }

/* Safe area bottom */
.pb-safe { padding-bottom:max(16px, env(safe-area-inset-bottom)); }

/* ── TELL SCREEN ── */
#tell-screen { background:var(--bg); flex-direction:column; }
.tell-head { padding:52px 20px 16px; display:flex; align-items:center; gap:12px; flex-shrink:0; border-bottom:1px solid var(--border); }
.tell-topic-label { flex:1; }
.tell-topic-label .tl { font-size:11px; color:var(--text2); margin-bottom:3px; font-weight:600; }
.tell-topic-label .tv { font-size:15px; font-weight:800; }
.tell-body { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; padding-bottom:80px; }

.tell-hero { padding:20px; border-radius:18px; background:var(--s1); border:1px solid var(--border2); text-align:center; }
.tell-hero .th-em { font-size:36px; margin-bottom:10px; }
.tell-hero .th-title { font-size:19px; font-weight:800; margin-bottom:8px; }
.tell-hero .th-sub { font-size:13px; color:var(--text2); line-height:1.6; }

.tell-hint-btn {
  padding:16px; border-radius:14px; width:100%; font-family:var(--sans);
  background:var(--blue-glow); border:1.5px solid rgba(79,143,255,.35);
  color:var(--blue); font-size:14px; font-weight:700; cursor:pointer; text-align:center;
}
.tell-hint-btn:active { opacity:.75; }

.tell-sent { padding:14px 16px; border-radius:14px; background:var(--s1); border:1px solid var(--border2); animation:slideIn .2s ease; }
@keyframes slideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.ts-n { font-size:10px; font-weight:700; letter-spacing:1px; color:var(--text3); text-transform:uppercase; margin-bottom:8px; }
.ts-ancs { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
.anc-sm { padding:4px 10px; border-radius:100px; background:var(--blue-glow); border:1px solid rgba(79,143,255,.25); font-size:12px; font-weight:700; color:var(--blue); }
.ts-reveal { font-size:11px; color:var(--text3); cursor:pointer; font-weight:600; }
.ts-full { font-size:14px; font-weight:600; line-height:1.6; color:var(--text); display:none; margin-top:8px; }
.ts-full.show { display:block; }
.ts-full strong { color:#7aabff; }
.tell-done-banner { padding:14px; border-radius:14px; background:var(--green-glow); border:1.5px solid rgba(62,207,142,.3); text-align:center; font-size:15px; font-weight:700; color:var(--green); }
.tell-reset { padding:14px; border-radius:14px; width:100%; font-family:var(--sans); background:var(--s1); border:1px solid var(--border2); color:var(--text2); font-size:14px; font-weight:700; cursor:pointer; text-align:center; }

/* ── READ SCREEN ── */
#read-screen { background:var(--bg); flex-direction:column; }
.read-head { padding:52px 20px 14px; display:flex; align-items:center; gap:12px; flex-shrink:0; border-bottom:1px solid var(--border); }
.read-body { flex:1; overflow-y:auto; }
.s-row { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; gap:12px; cursor:pointer; }
.s-row:active { background:var(--s1); }
.s-num { font-size:11px; font-weight:700; color:var(--text3); padding-top:3px; flex-shrink:0; min-width:20px; }
.s-body { flex:1; }
.s-en { font-size:15px; font-weight:600; line-height:1.65; }
.s-en strong { color:#7aabff; font-weight:800; }
.s-ru { font-size:13px; color:var(--text2); line-height:1.55; margin-top:6px; display:none; }
.s-ru.show { display:block; }
.s-ru strong { color:rgba(155,111,255,.75); font-weight:700; }
.s-tog { flex-shrink:0; width:28px; height:28px; border-radius:8px; background:var(--s1); border:1px solid var(--border2); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--text2); font-weight:700; margin-top:2px; }
.s-tog.open { background:var(--blue-glow); border-color:rgba(79,143,255,.4); color:var(--blue); }

/* ── FINISH ── */
.tr-finish { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 20px; text-align:center; gap:14px; }
.tr-finish .fe { font-size:60px; }
.tr-finish .ft { font-size:24px; font-weight:900; letter-spacing:-.5px; color:var(--green); }
.tr-finish .fs { font-size:14px; color:var(--text2); line-height:1.7; }
.tr-finish .ff1 { background:linear-gradient(135deg, var(--blue), #6a5aff); color:#fff; border:none; border-radius:16px; padding:17px; font-size:15px; font-weight:700; font-family:var(--sans); cursor:pointer; width:100%; }
.tr-finish .ff2 { background:var(--s1); border:1px solid var(--border2); color:var(--text2); border-radius:16px; padding:15px; font-size:14px; font-weight:700; font-family:var(--sans); cursor:pointer; width:100%; }

/* ── HOME BOTTOM NAV ── */
.home-nav { position:fixed; bottom:0; left:0; right:0; background:rgba(10,11,15,.95); backdrop-filter:blur(20px); border-top:1px solid var(--border); padding:10px 20px max(16px, env(safe-area-inset-bottom)); display:flex; gap:10px; z-index:50; }
.rnd-btn {
  flex:1; padding:14px; border-radius:14px; background:var(--s2); border:1px solid var(--border2);
  font-size:14px; font-weight:700; font-family:var(--sans); color:var(--text2); cursor:pointer; text-align:center;
}
.rnd-btn:active { background:var(--s3); }
.rnd-btn.active { background:var(--blue-glow); border-color:rgba(79,143,255,.3); color:var(--blue); }

/* Result overlay */
.result-flash {
  position:fixed; top:0; left:0; right:0; bottom:0;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none; z-index:200;
  opacity:0;
}
.result-flash.show-right { animation:flashRight .6s ease; }
.result-flash.show-wrong  { animation:flashWrong .6s ease; }
@keyframes flashRight { 0%{opacity:0} 30%{opacity:1} 100%{opacity:0} }
@keyframes flashWrong { 0%{opacity:0} 30%{opacity:1} 100%{opacity:0} }
.flash-inner { font-size:80px; }

</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="home-bg"></div>
  <div class="home-head">
    <div class="greeting">АНГЛИЙСКИЙ · ЗАЧЁТ</div>
    <h1>Выбери<br><span class="dim">тему для изучения</span></h1>
    <div class="sub">Открой тему → тренируйся → рассказывай</div>
  </div>
  <div class="topics-grid" id="topics-grid"></div>
  <div class="home-nav">
    <button class="rnd-btn" onclick="rollRandom()">🎲 Случайная тема</button>
    <button class="rnd-btn" id="rnd-tell-btn" onclick="openRandomTell()" style="display:none">🎤 Рассказать её</button>
  </div>
</div>

<!-- TRAINER -->
<div id="trainer" class="screen">
  <div class="trainer-head">
    <div class="tr-back" onclick="goHome()">←</div>
    <div class="tr-topic">
      <div class="tr-topic-name" id="tr-topic-name">-</div>
      <div class="tr-topic-sub" id="tr-topic-sub">-</div>
    </div>
    <button class="tr-read-btn" onclick="openRead()">📖 Текст</button>
  </div>
  <div class="tr-prog-strip">
    <div class="tr-prog-nums">
      <span>Выучено предложений</span>
      <span class="pn-val" id="tr-prog-txt">0 / 15</span>
    </div>
    <div class="big-bar"><div class="big-fill" id="tr-big-fill" style="width:0%"></div></div>
  </div>
  <div class="stages-track" id="stages-track"></div>
  <div class="tr-card-wrap" id="tr-card-wrap"></div>
  <div class="tr-actions" id="tr-actions"></div>
</div>

<!-- READ -->
<div id="read-screen" class="screen">
  <div class="read-head">
    <div class="tr-back" onclick="closeRead()">←</div>
    <div class="tr-topic">
      <div class="tr-topic-name" id="read-topic-name">Текст</div>
      <div class="tr-topic-sub">Читай и запоминай</div>
    </div>
  </div>
  <div class="read-body" id="read-body"></div>
</div>

<!-- TELL -->
<div id="tell-screen" class="screen">
  <div class="tell-head">
    <div class="tr-back" onclick="closeTell()">←</div>
    <div class="tell-topic-label">
      <div class="tl">РАССКАЗАТЬ БЕЗ ПОДСКАЗОК</div>
      <div class="tv" id="tell-topic-name">-</div>
    </div>
  </div>
  <div class="tell-body" id="tell-body"></div>
</div>

<!-- Flash overlay -->
<div class="result-flash" id="result-flash">
  <div class="flash-inner" id="flash-inner"></div>
</div>

<script>
const TOPICS = [
{id:0,emoji:"🌐",title:"Computer Networks",color:"#7aabff",sentences:[
{en:"Modern <strong>networks</strong> connect devices to share information fast.",ru:"Современные <strong>сети</strong> соединяют устройства для быстрого обмена информацией."},
{en:"A <strong>local area network (LAN)</strong> is used in a company, university, or office.",ru:"<strong>Локальная сеть (LAN)</strong> используется в компании, университете или офисе."},
{en:"Computers connect through <strong>network interface cards (NICs)</strong>.",ru:"Компьютеры подключаются через <strong>сетевые интерфейсные карты (NIC)</strong>."},
{en:"A <strong>file server</strong> stores documents for network users.",ru:"<strong>Файловый сервер</strong> хранит документы для пользователей сети."},

// ── STATE ──
let curTopic = null;
let trIdx = 0, trStage = 0, trRevealed = false;
let tellRev = 0, randomId = null;

const STAGES = [
  { key:'read',  label:'📖 Читай',      badge:'sb-read',  cls:'st-read',  desc:'Читай вслух 2-3 раза — просто запомни как звучит' },
  { key:'ru',    label:'🇷🇺 Перевод',   badge:'sb-ru',    cls:'st-ru',    desc:'Скажи по-английски, глядя на русский' },
  { key:'anc',   label:'⚓ Якоря',      badge:'sb-anc',   cls:'st-anc',   desc:'Вспомни полное предложение по ключевым словам' },
  { key:'blank', label:'🧠 Наизусть',   badge:'sb-blank', cls:'st-blank', desc:'Скажи всё сам — без подсказок' },
];

function getAncs(html) {
  return [...html.matchAll(/<strong>(.*?)<\/strong>/g)].map(m => m[1]);
}

// ── HOME ──
function buildHome() {
  document.getElementById('topics-grid').innerHTML = TOPICS.map((t,i) => {
    const prog = parseInt(localStorage.getItem('prog_'+t.id)||0);
    const pct = Math.round(prog / (t.sentences.length * 4) * 100);
    return `<div class="t-card" onclick="openTopic(${i})">
      <div class="t-glow"></div>
      <div class="t-emoji">${t.emoji}</div>
      <div class="t-info">
        <div class="t-title">${t.title}</div>
        <div class="t-meta">${pct > 0 ? `Прогресс: ${pct}%` : '15 предложений · 4 стадии'}</div>
        <div class="t-prog-bar"><div class="t-prog-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="t-arrow">›</div>
    </div>`;
  }).join('');
}

// ── OPEN TOPIC ──
function openTopic(id) {
  curTopic = id;
  const saved = parseInt(localStorage.getItem('tr_'+id+'_idx')||0);
  const savedStage = parseInt(localStorage.getItem('tr_'+id+'_stage')||0);
  trIdx = saved; trStage = savedStage; trRevealed = false;
  document.getElementById('tr-topic-name').textContent = TOPICS[id].emoji + ' ' + TOPICS[id].title;
  showScreen('trainer');
  renderTrainer();
}

// ── TRAINER ──
function renderTrainer() {
  const t = TOPICS[curTopic];
  const total = t.sentences.length;
  saveProgress();

  if (trIdx >= total) { renderFinish(); return; }

  const s = t.sentences[trIdx];
  const st = STAGES[trStage];
  const ancs = getAncs(s.en);

  // Progress
  const done = trIdx * 4 + trStage;
  const max = total * 4;
  const pct = (done / max * 100).toFixed(1);
  document.getElementById('tr-prog-txt').textContent = `${trIdx} / ${total}`;
  document.getElementById('tr-big-fill').style.width = pct + '%';
  document.getElementById('tr-topic-sub').textContent = STAGES[trStage].desc;

  // Stage pips
  document.getElementById('stages-track').innerHTML = STAGES.map((_,i) => {
    let cls = 'stage-pip';
    if (i < trStage) cls += ' s-done';
    else if (i === trStage) cls += ' s-cur-'+i;
    return `<div class="${cls}"></div>`;
  }).join('');

  // Card wrap: prev ghost + main card
  let cardHTML = '';

  // Previous sentence (ghost)
  if (trIdx > 0) {
    const prev = t.sentences[trIdx-1];
    cardHTML += `<div class="prev-ghost">
      <div class="pg-label">✓ ${trIdx} — запомнил</div>
      <div class="pg-text">${prev.en}</div>
    </div>`;
  }

  // Main card
  cardHTML += `<div class="tr-card ${st.cls}">
    <div class="stage-badge ${st.badge}">${st.label}</div>
    <div class="card-content">`;

  if (trStage === 0) {
    cardHTML += `<div class="full-en">${s.en}</div><div class="full-ru">${s.ru}</div>`;
  } else if (trStage === 1) {
    cardHTML += `<div class="ru-only">${s.ru}</div>`;
    if (trRevealed) {
      cardHTML += `<div class="reveal-box show"><div class="reveal-en">${s.en}</div></div>`;
    } else {
      cardHTML += `<div class="card-tap-hint">Скажи по-английски ↓ потом проверь</div>`;
    }
  } else if (trStage === 2) {
    cardHTML += `<div class="anchors-wrap">${ancs.map(a=>`<span class="anc-pill">${a}</span>`).join('')}</div>`;
    if (trRevealed) {
      cardHTML += `<div class="reveal-box show"><div class="reveal-en">${s.en}</div><div class="reveal-ru">${s.ru}</div></div>`;
    } else {
      cardHTML += `<div class="card-tap-hint">Произнеси полное предложение ↓ потом проверь</div>`;
    }
  } else {
    cardHTML += `<div class="blank-num">${trIdx+1}</div><div class="blank-sub">Предложение №${trIdx+1} — скажи по памяти</div>`;
    if (trRevealed) {
      cardHTML += `<div class="reveal-box show"><div class="reveal-en">${s.en}</div><div class="reveal-ru">${s.ru}</div></div>`;
    } else {
      cardHTML += `<div class="card-tap-hint">Произнеси полностью ↓ потом проверь</div>`;
    }
  }

  cardHTML += `</div></div>`; // card-content, tr-card
  document.getElementById('tr-card-wrap').innerHTML = cardHTML;

  // Buttons
  let btns = '';
  if (trStage === 0) {
    btns = `<button class="action-btn btn-primary" onclick="trNext()">Запомнил — дальше →</button>`;
  } else if (!trRevealed) {
    btns = `<button class="action-btn btn-check" onclick="trReveal()">👁 Проверить себя</button>`;
  } else {
    btns = `<button class="action-btn btn-wrong" onclick="trWrong()">❌ Не вспомнил</button>
            <button class="action-btn btn-right" onclick="trRight()">✅ Вспомнил</button>`;
  }
  document.getElementById('tr-actions').innerHTML = `<div class="pb-safe">${btns}</div>`;
}

function renderFinish() {
  document.getElementById('stages-track').innerHTML = '';
  document.getElementById('tr-prog-txt').textContent = '15 / 15';
  document.getElementById('tr-big-fill').style.width = '100%';
  document.getElementById('tr-topic-sub').textContent = 'Тренажёр пройден!';
  document.getElementById('tr-card-wrap').innerHTML = `
    <div class="tr-finish">
      <div class="fe">🏆</div>
      <div class="ft">Готово!</div>
      <div class="fs">Все 15 предложений пройдены через 4 стадии.<br>Теперь проверь себя — расскажи без подсказок.</div>
      <button class="ff1" onclick="openTell()">🎤 Рассказать без подсказок</button>
      <button class="ff2" style="margin-top:8px" onclick="resetTrain()">🔄 Пройти заново</button>
    </div>`;
  document.getElementById('tr-actions').innerHTML = '';
}

function saveProgress() {
  localStorage.setItem('tr_'+curTopic+'_idx', trIdx);
  localStorage.setItem('tr_'+curTopic+'_stage', trStage);
  const done = trIdx * 4 + trStage;
  localStorage.setItem('prog_'+curTopic, done);
}

function trReveal() { trRevealed = true; renderTrainer(); }

function trNext() { trStage = 1; trRevealed = false; renderTrainer(); }

function trRight() {
  flash('✅');
  if (trStage < 3) { trStage++; }
  else { trIdx++; trStage = 0; }
  trRevealed = false;
  setTimeout(renderTrainer, 300);
}

function trWrong() {
  flash('❌');
  trStage = 0; trRevealed = false;
  setTimeout(renderTrainer, 300);
}

function resetTrain() {
  trIdx = 0; trStage = 0; trRevealed = false;
  localStorage.removeItem('tr_'+curTopic+'_idx');
  localStorage.removeItem('tr_'+curTopic+'_stage');
  localStorage.removeItem('prog_'+curTopic);
  renderTrainer();
}

function flash(emoji) {
  const el = document.getElementById('result-flash');
  document.getElementById('flash-inner').textContent = emoji;
  el.className = 'result-flash ' + (emoji === '✅' ? 'show-right' : 'show-wrong');
  setTimeout(() => { el.className = 'result-flash'; }, 700);
}

// ── READ ──
function openRead() {
  const t = TOPICS[curTopic];
  document.getElementById('read-topic-name').textContent = t.emoji + ' ' + t.title;
  document.getElementById('read-body').innerHTML = t.sentences.map((s,i) => `
    <div class="s-row" onclick="togRu(${i})">
      <div class="s-num">${i+1}</div>
      <div class="s-body">
        <div class="s-en">${s.en}</div>
        <div class="s-ru" id="ru${i}">${s.ru}</div>
      </div>
      <div class="s-tog" id="tog${i}">RU</div>
    </div>`).join('');
  showScreen('read-screen');
}

function closeRead() { showScreen('trainer'); }

function togRu(i) {
  const r = document.getElementById('ru'+i), t = document.getElementById('tog'+i);
  t.classList.toggle('open', r.classList.toggle('show'));
}

// ── TELL ──
function openTell() {
  tellRev = 0;
  document.getElementById('tell-topic-name').textContent = TOPICS[curTopic].emoji + ' ' + TOPICS[curTopic].title;
  showScreen('tell-screen');
  renderTell();
}

function closeTell() { showScreen('trainer'); }

function renderTell() {
  const t = TOPICS[curTopic], total = t.sentences.length;
  let h = `<div class="tell-hero">
    <div class="th-em">${t.emoji}</div>
    <div class="th-title">${t.title}</div>
    <div class="th-sub">Расскажи весь текст по-английски.<br>Застрял — нажми кнопку, появятся якоря.</div>
  </div>`;

  for (let i = 0; i < tellRev; i++) {
    const s = t.sentences[i], ancs = getAncs(s.en);
    h += `<div class="tell-sent">
      <div class="ts-n">ПРЕДЛОЖЕНИЕ ${i+1}</div>
      <div class="ts-ancs">${ancs.map(a=>`<span class="anc-sm">${a}</span>`).join('')}</div>
      <span class="ts-reveal" onclick="togFull(${i})">👁 показать текст</span>
      <div class="ts-full" id="tf${i}">${s.en}</div>
    </div>`;
  }

  if (tellRev < total) {
    h += `<button class="tell-hint-btn" onclick="revNext()">⚓ ${tellRev === 0 ? 'Подсказка к предложению 1' : `Предложение ${tellRev+1} / ${total}`}</button>`;
  } else {
    h += `<div class="tell-done-banner">🎉 Весь текст открыт — отличная работа!</div>`;
  }
  h += `<button class="tell-reset" onclick="buildTell()">🔄 Начать заново</button>`;
  document.getElementById('tell-body').innerHTML = h;
}

function buildTell() { tellRev = 0; renderTell(); }

function revNext() {
  tellRev++;
  renderTell();
  setTimeout(() => { const b = document.getElementById('tell-body'); b.scrollTop = b.scrollHeight; }, 60);
}

function togFull(i) {
  const el = document.getElementById('tf'+i); if (!el) return;
  const on = el.classList.toggle('show');
  el.previousElementSibling.textContent = on ? '🙈 скрыть' : '👁 показать текст';
}

// ── RANDOM ──
function rollRandom() {
  randomId = Math.floor(Math.random() * TOPICS.length);
  const t = TOPICS[randomId];
  const btn = document.getElementById('rnd-tell-btn');
  btn.style.display = 'block';
  btn.textContent = `🎤 ${t.emoji} ${t.title}`;
  // flash the card
  const cards = document.querySelectorAll('.t-card');
  cards.forEach((c,i) => { c.style.opacity = i === randomId ? '1' : '0.4'; });
  setTimeout(() => cards.forEach(c => c.style.opacity = '1'), 1500);
}

function openRandomTell() {
  if (randomId === null) return;
  curTopic = randomId;
  openTell();
}

// ── SCREEN NAV ──
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome() {
  showScreen('home');
  buildHome(); // refresh progress bars
}

buildHome();
</script>
</body>
</html>
