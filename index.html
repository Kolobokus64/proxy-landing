<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Study App</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f14;
    --surface: #16181f;
    --card: #1e2029;
    --border: #2a2d3a;
    --accent: #5b8aff;
    --accent2: #ff6b6b;
    --accent3: #48d9a4;
    --text: #e8eaf0;
    --muted: #7a7f96;
    --mono: 'Space Mono', monospace;
    --sans: 'Manrope', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── SCREENS ── */
  .screen { display: none; min-height: 100vh; padding-bottom: 80px; }
  .screen.active { display: block; }

  /* ── HOME ── */
  #home {
    padding: 0;
    background: var(--bg);
  }

  .home-header {
    padding: 52px 24px 28px;
    background: linear-gradient(160deg, #1a1d2e 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--border);
  }

  .home-header .label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .home-header h1 {
    font-size: 28px;
    font-weight: 800;
    line-height: 1.2;
    color: var(--text);
  }

  .home-header h1 span { color: var(--accent); }

  .home-header .subtitle {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }

  .topics-list {
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .topic-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s, background 0.2s;
    position: relative;
    overflow: hidden;
  }

  .topic-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    border-radius: 16px 16px 0 0;
    transition: opacity 0.2s;
  }

  .topic-card:nth-child(1)::before { background: var(--accent); }
  .topic-card:nth-child(2)::before { background: var(--accent2); }
  .topic-card:nth-child(3)::before { background: var(--accent3); }
  .topic-card:nth-child(4)::before { background: #f7a941; }

  .topic-card:active { transform: scale(0.97); background: #22252f; }

  .topic-num {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .topic-title {
    font-size: 18px;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .topic-card:nth-child(1) .topic-title { color: var(--accent); }
  .topic-card:nth-child(2) .topic-title { color: var(--accent2); }
  .topic-card:nth-child(3) .topic-title { color: var(--accent3); }
  .topic-card:nth-child(4) .topic-title { color: #f7a941; }

  .topic-meta {
    font-size: 12px;
    color: var(--muted);
  }

  .topic-arrow {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    color: var(--border);
  }

  /* ── TOPIC SCREEN ── */
  #topic-screen {
    padding-bottom: 90px;
  }

  .topic-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .back-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    width: 38px; height: 38px;
    border-radius: 10px;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .back-btn:active { background: var(--border); }

  .topic-header-info { flex: 1; min-width: 0; }

  .topic-header-name {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .topic-header-hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
  }

  /* Mode tabs */
  .mode-tabs {
    display: flex;
    gap: 8px;
    padding: 16px 20px 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .mode-tabs::-webkit-scrollbar { display: none; }

  .mode-tab {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 700;
    font-family: var(--sans);
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--muted);
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }

  .mode-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  /* ── READ MODE ── */
  #mode-read { padding: 4px 0; }

  .sentence-item {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 14px;
    align-items: flex-start;
    cursor: pointer;
    transition: background 0.15s;
  }

  .sentence-item:active { background: var(--card); }

  .s-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    padding-top: 3px;
    flex-shrink: 0;
    min-width: 20px;
  }

  .s-content { flex: 1; }

  .s-en {
    font-size: 15px;
    line-height: 1.55;
    font-weight: 600;
    color: var(--text);
  }

  .s-en strong {
    color: var(--accent);
    font-weight: 700;
  }

  .s-ru {
    font-size: 13px;
    line-height: 1.5;
    color: var(--muted);
    margin-top: 5px;
    display: none;
  }

  .s-ru.visible { display: block; }

  .s-ru strong { color: #8899cc; font-weight: 600; }

  .toggle-ru {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.15s;
    margin-top: 2px;
    font-family: var(--mono);
  }

  .toggle-ru.open {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  /* ── CARDS MODE ── */
  #mode-cards {
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .card-counter {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .learning-progress {
    width: 100%;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    font-family: var(--mono);
    letter-spacing: 0.5px;
  }

  .flashcard {
    width: 100%;
    min-height: 240px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s, border-color 0.2s;
    user-select: none;
    touch-action: pan-y;
  }

  .flashcard:active { transform: scale(0.97); }

  .flashcard.swiping {
    transition: none;
  }

  .flashcard.swipe-left {
    animation: swipeOutLeft 0.3s ease-out forwards;
  }

  .flashcard.swipe-right {
    animation: swipeOutRight 0.3s ease-out forwards;
  }

  @keyframes swipeOutLeft {
    to {
      transform: translateX(-100%) rotateZ(-8deg);
      opacity: 0;
    }
  }

  @keyframes swipeOutRight {
    to {
      transform: translateX(100%) rotateZ(8deg);
      opacity: 0;
    }
  }

  .fc-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .fc-stage {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .fc-hint-words {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.6;
    color: var(--accent);
    margin-bottom: 20px;
  }

  .fc-hint-words span {
    display: inline;
    margin: 0 8px;
  }

  .fc-translation {
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.6;
    width: 100%;
    text-align: center;
    display: none;
  }

  .fc-translation.visible { display: block; }
  .fc-translation strong { color: #8899cc; font-weight: 700; }

  .fc-full-text {
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.7;
    width: 100%;
    text-align: center;
    display: none;
  }

  .fc-full-text.visible { display: block; }
  .fc-full-text strong { color: var(--accent); }

  .tap-hint {
    margin-top: 16px;
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
    letter-spacing: 0.5px;
  }

  .card-feedback {
    display: flex;
    gap: 12px;
    width: 100%;
    margin-top: 4px;
  }

  .card-feedback-btn {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    font-size: 14px;
    font-weight: 700;
    font-family: var(--sans);
    cursor: pointer;
    transition: all 0.15s;
    display: none;
  }

  .card-feedback-btn.show { display: block; }

  .card-feedback-btn.wrong {
    background: #ff6b6b;
    border-color: #ff6b6b;
    color: white;
  }

  .card-feedback-btn.wrong:active { opacity: 0.8; }

  .card-feedback-btn.correct {
    background: var(--accent3);
    border-color: var(--accent3);
    color: white;
  }

  .card-feedback-btn.correct:active { opacity: 0.8; }

  /* ── HIDE MODE ── */
  #mode-hide { padding: 0; }

  .hide-controls {
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    align-items: center;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .hide-label {
    font-size: 12px;
    color: var(--muted);
    flex-shrink: 0;
  }

  .hide-slider {
    flex: 1;
    min-width: 120px;
    accent-color: var(--accent);
    height: 4px;
  }

  .hide-pct {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    min-width: 32px;
    text-align: right;
  }

  .hide-reveal-btn {
    width: 100%;
    padding: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    font-family: var(--sans);
    cursor: pointer;
    transition: all 0.2s;
    margin: 0 20px;
    width: calc(100% - 40px);
  }

  .hide-reveal-btn:active { background: var(--accent); border-color: var(--accent); color: white; }

  .hidden-word {
    display: inline-block;
    background: var(--border);
    color: transparent;
    border-radius: 4px;
    min-width: 60px;
    height: 1.1em;
    vertical-align: baseline;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    top: 0.1em;
  }

  .hidden-word.revealed {
    background: rgba(91, 138, 255, 0.15);
    color: var(--accent);
  }

  /* ── PROGRESS INDICATOR ── */
  .prog-bar {
    height: 3px;
    background: var(--border);
    margin: 0 20px 16px;
    border-radius: 100px;
    overflow: hidden;
  }

  .prog-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 100px;
    transition: width 0.3s ease;
  }

  /* ── RANDOM TOPIC SCREEN ── */
  #random-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 24px;
  }

  .random-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 32px;
    text-align: center;
  }

  .dice-btn {
    width: 120px; height: 120px;
    border-radius: 32px;
    background: linear-gradient(135deg, var(--accent), #3a5fd6);
    border: none;
    font-size: 52px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 40px rgba(91, 138, 255, 0.35);
    transition: transform 0.15s, box-shadow 0.15s;
    margin-bottom: 24px;
  }

  .dice-btn:active {
    transform: scale(0.9) rotate(-5deg);
    box-shadow: 0 4px 20px rgba(91, 138, 255, 0.2);
  }

  .random-result {
    text-align: center;
    margin-top: 12px;
  }

  .random-result-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 12px;
    font-family: var(--mono);
    letter-spacing: 1px;
  }

  .random-result-topic {
    font-size: 24px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.2;
    margin-bottom: 20px;
  }

  .random-go-btn {
    padding: 14px 32px;
    border-radius: 14px;
    background: var(--accent);
    border: none;
    color: white;
    font-size: 15px;
    font-weight: 700;
    font-family: var(--sans);
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .random-go-btn:active { opacity: 0.8; }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(14, 15, 20, 0.96);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 4px 12px;
    cursor: pointer;
    gap: 4px;
    transition: opacity 0.15s;
    border: none;
    background: transparent;
    color: var(--muted);
  }

  .nav-item.active { color: var(--accent); }
  .nav-item:active { opacity: 0.6; }

  .nav-icon { font-size: 22px; }
  .nav-label { font-size: 10px; font-weight: 700; letter-spacing: 0.3px; font-family: var(--sans); }

  /* ── ANIMATIONS ── */
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .screen.active { animation: fadeSlideUp 0.25s ease; }

  .flashcard { animation: fadeSlideUp 0.2s ease; }

  /* Ripple */
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .spinning { animation: spin 0.4s ease; }

  @media (min-width: 480px) {
    .topics-list { max-width: 480px; margin: 0 auto; }
    #mode-cards { max-width: 480px; margin: 0 auto; }
    #random-screen { max-width: 480px; margin: 0 auto; width: 100%; align-self: center; }
  }
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="home-header">
    <div class="label">// EXAM PREP</div>
    <h1>Учи <span>тексты</span><br>на английском</h1>
    <div class="subtitle">4 темы · 15 предложений каждая · 3 режима изучения</div>
  </div>
  <div class="topics-list" id="topics-list"></div>
</div>

<!-- TOPIC -->
<div id="topic-screen" class="screen">
  <div class="topic-header">
    <div class="back-btn" onclick="goHome()">←</div>
    <div class="topic-header-info">
      <div class="topic-header-name" id="topic-header-name">Topic</div>
      <div class="topic-header-hint">Нажми на предложение → перевод</div>
    </div>
  </div>

  <div class="mode-tabs">
    <button class="mode-tab active" onclick="switchMode('read', this)">📖 Читать</button>
    <button class="mode-tab" onclick="switchMode('cards', this)">🃏 Карточки</button>
    <button class="mode-tab" onclick="switchMode('hide', this)">🙈 Скрыть слова</button>
  </div>

  <div id="mode-read"></div>
  <div id="mode-cards" style="display:none"></div>
  <div id="mode-hide" style="display:none">
    <div class="hide-controls">
      <span class="hide-label">Скрыть:</span>
      <input type="range" class="hide-slider" id="hide-slider" min="0" max="100" value="50" oninput="updateHideMode()">
      <span class="hide-pct" id="hide-pct">50%</span>
    </div>
    <div style="margin: 0 20px 12px;">
      <button class="hide-reveal-btn" onclick="revealAll()">👁 Показать всё</button>
    </div>
    <div id="mode-hide-content"></div>
  </div>
</div>

<!-- RANDOM -->
<div id="random-screen" class="screen">
  <div class="random-label">// СИМУЛЯТОР ЗАЧЁТА</div>
  <button class="dice-btn" id="dice-btn" onclick="rollDice()">🎲</button>
  <div class="random-result" id="random-result" style="display:none">
    <div class="random-result-label">ВЫПАЛА ТЕМА:</div>
    <div class="random-result-topic" id="random-topic-name"></div>
    <button class="random-go-btn" onclick="goToRandomTopic()">Открыть тему →</button>
  </div>
  <div id="random-hint" style="font-size:13px; color:var(--muted); text-align:center; margin-top:8px;">Нажми на кубик — выпадет тема как на зачёте</div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="showScreen('home', this)">
    <span class="nav-icon">📚</span>
    <span class="nav-label">Темы</span>
  </button>
  <button class="nav-item" onclick="showScreen('random-screen', this)">
    <span class="nav-icon">🎲</span>
    <span class="nav-label">Рандом</span>
  </button>
</nav>

<script>
const TOPICS = [
  {
    id: 0,
    title: "Computer Networks",
    color: "#5b8aff",
    emoji: "🌐",
    sentences: [
      { en: "Modern <strong>networks</strong> connect devices to share information fast.", ru: "Современные <strong>сети</strong> соединяют устройства для быстрого обмена информацией." },
      { en: "A <strong>local area network (LAN)</strong> is used in a company, university, or office.", ru: "<strong>Локальная сеть (LAN)</strong> используется в компании, университете или офисе." },
      { en: "Computers connect through <strong>network interface cards (NICs)</strong>.", ru: "Компьютеры подключаются через <strong>сетевые интерфейсные карты (NIC)</strong>." },
      { en: "A <strong>file server</strong> stores documents for network users.", ru: "<strong>Файловый сервер</strong> хранит документы для пользователей сети." },
      { en: "Offices often use a <strong>shared network printer</strong>.", ru: "Офисы часто используют <strong>общий сетевой принтер</strong>." },
      { en: "A <strong>router</strong> sends data packets and connects computers to the Internet.", ru: "<strong>Маршрутизатор</strong> отправляет пакеты данных и подключает компьютеры к Интернету." },
      { en: "Large companies use a high-speed <strong>backbone</strong> to send information between offices.", ru: "Крупные компании используют высокоскоростную <strong>магистральную сеть</strong> для отправки информации между офисами." },
      { en: "A <strong>bridge</strong> connects similar local networks.", ru: "<strong>Мост</strong> соединяет похожие локальные сети." },
      { en: "A <strong>gateway</strong> helps computers with different systems exchange data.", ru: "<strong>Шлюз</strong> помогает компьютерам с разными системами обмениваться данными." },
      { en: "Wireless <strong>Wi-Fi networks</strong> let users work without cables.", ru: "Беспроводные <strong>Wi-Fi сети</strong> позволяют пользователям работать без кабелей." },

let currentTopic = null;
let cardIndex = 0;
let cardOrder = [];
let currentMode = 'read';
let randomTopicId = null;

// Система +1: отслеживание прогресса по карточкам
let learningQueue = [];     // Очередь карточек для изучения [0,1,2...]
let learningPointer = 0;    // Текущее положение в очереди
let cardState = 0;          // 0=подсказка, 1=перевод, 2=полный текст
let correctInRow = 0;       // Сколько раз подряд правильно ответили

// Свайп
let touchStartX = 0;
let touchEndX = 0;
const SWIPE_THRESHOLD = 50;

function extractHints(text) {
  // Извлекаем все слова в <strong></strong>
  const regex = /<strong>(.*?)<\/strong>/g;
  let matches = [];
  let match;
  while ((match = regex.exec(text)) !== null) {
    matches.push(match[1]);
  }
  return matches.length > 0 ? matches : ['...'];
}

// Build home screen
function buildHome() {
  const list = document.getElementById('topics-list');
  list.innerHTML = TOPICS.map((t, i) => `
    <div class="topic-card" onclick="openTopic(${i})">
      <div class="topic-num">// 0${i+1}</div>
      <div class="topic-title">${t.emoji} ${t.title}</div>
      <div class="topic-meta">15 предложений</div>
      <div class="topic-arrow">›</div>
    </div>
  `).join('');
}

function openTopic(id) {
  currentTopic = id;
  currentMode = 'read';
  const t = TOPICS[id];
  document.getElementById('topic-header-name').textContent = t.title;

  // Reset tabs
  document.querySelectorAll('.mode-tab').forEach((tab, i) => {
    tab.classList.toggle('active', i === 0);
  });

  buildReadMode();
  buildHideMode();

  document.getElementById('mode-read').style.display = '';
  document.getElementById('mode-cards').style.display = 'none';
  document.getElementById('mode-hide').style.display = 'none';

  showScreen('topic-screen', null);
}

function buildReadMode() {
  const t = TOPICS[currentTopic];
  const el = document.getElementById('mode-read');
  el.innerHTML = t.sentences.map((s, i) => `
    <div class="sentence-item" onclick="toggleRu(${i})">
      <div class="s-num">${i+1}</div>
      <div class="s-content">
        <div class="s-en">${s.en}</div>
        <div class="s-ru" id="ru-${i}">${s.ru}</div>
      </div>
      <div class="toggle-ru" id="toggle-${i}">RU</div>
    </div>
  `).join('');
}

function toggleRu(i) {
  const ru = document.getElementById(`ru-${i}`);
  const btn = document.getElementById(`toggle-${i}`);
  const open = ru.classList.toggle('visible');
  btn.classList.toggle('open', open);
}

function buildCardsMode() {
  const t = TOPICS[currentTopic];
  // Инициализируем очередь со всеми карточками
  learningQueue = t.sentences.map((_, i) => i);
  learningPointer = 0;
  cardState = 0;
  correctInRow = 0;
  renderCard();
}

function renderCard() {
  const t = TOPICS[currentTopic];
  
  // Если прошли всё - показываем завершение
  if (learningPointer >= learningQueue.length) {
    document.getElementById('mode-cards').innerHTML = `
      <div style="text-align: center; padding: 40px 20px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div style="font-size: 48px; margin-bottom: 20px;">🎉</div>
        <div style="font-size: 20px; font-weight: 800; color: var(--accent); margin-bottom: 12px;">Отлично!</div>
        <div style="font-size: 14px; color: var(--muted); margin-bottom: 32px; line-height: 1.6;">Ты выучил все карточки<br>этой темы</div>
        <button class="card-feedback-btn correct show" onclick="buildCardsMode()" style="width: 100%; max-width: 240px;">Начать заново</button>
      </div>
    `;
    return;
  }

  const sentenceIndex = learningQueue[learningPointer];
  const s = t.sentences[sentenceIndex];
  const hints = extractHints(s.en);

  // Текущий уровень овладения карточкой
  const level = cardState; // 0 = подсказка, 1 = перевод, 2 = полный текст

  let cardHTML = `
    <div class="card-counter">Карточка ${learningPointer + 1} / ${learningQueue.length}</div>
    <div class="learning-progress">// Правильно подряд: ${correctInRow} | Уровень: ${level + 1}/3</div>
    <div class="prog-bar"><div class="prog-fill" style="width:${((learningPointer) / learningQueue.length * 100).toFixed(0)}%"></div></div>
    
    <div class="flashcard" id="flashcard">
      <div class="fc-label">Предложение ${sentenceIndex + 1}</div>
      <div class="fc-stage">${level === 0 ? '1️⃣ Подсказка' : level === 1 ? '2️⃣ Перевод' : '3️⃣ Полный текст'}</div>
  `;

  if (level === 0) {
    // Только подсказка - выделенные слова
    cardHTML += `
      <div class="fc-hint-words">
        ${hints.map(h => `<span>${h}</span>`).join('')}
      </div>
      <div class="tap-hint">↓ нажми или свайп вверх-вниз</div>
    `;
  } else if (level === 1) {
    // Перевод + подсказка
    cardHTML += `
      <div class="fc-hint-words">
        ${hints.map(h => `<span>${h}</span>`).join('')}
      </div>
      <div class="fc-translation visible">${s.ru}</div>
      <div class="tap-hint">↓ нажми для полного текста</div>
    `;
  } else {
    // Полный текст
    cardHTML += `
      <div class="fc-full-text visible">${s.en}</div>
      <div class="fc-translation visible" style="border-top:none; margin-top:20px; padding-top:0;">${s.ru}</div>
      <div class="tap-hint">← Свайп влево = не знаю | Свайп вправо = знаю →</div>
    `;
  }

  cardHTML += `
    </div>
    <div class="card-feedback" id="feedback-btns">
      <button class="card-feedback-btn wrong show" onclick="markWrong()">↙ Свайп влево<br>или ❌ Не смог</button>
      <button class="card-feedback-btn correct show" onclick="markCorrect()">↗ Свайп вправо<br>или ✅ Верно</button>
    </div>
  `;

  document.getElementById('mode-cards').innerHTML = cardHTML;
  
  // Добавляем обработчики свайпа и клика
  const flashcard = document.getElementById('flashcard');
  if (flashcard) {
    flashcard.addEventListener('touchstart', handleTouchStart, { passive: true });
    flashcard.addEventListener('touchend', handleTouchEnd, { passive: true });
    flashcard.addEventListener('click', () => {
      advanceCardState();
    });
  }
}

function advanceCardState() {
  if (cardState < 2) {
    cardState++;
    renderCard();
  }
}

function markCorrect() {
  correctInRow++;
  // Переходим к следующей карточке в очереди
  learningPointer++;
  cardState = 0;
  renderCard();
}

function markWrong() {
  // Неверно - возвращаемся в начало очереди
  learningPointer = 0;
  cardState = 0;
  correctInRow = 0;
  renderCard();
}

// Свайп
function handleTouchStart(e) {
  if (e.touches.length === 1) {
    touchStartX = e.touches[0].clientX;
  }
}

function handleTouchEnd(e) {
  if (e.changedTouches.length === 1) {
    touchEndX = e.changedTouches[0].clientX;
    const card = document.getElementById('flashcard');
    
    if (!card) return;
    
    const diff = touchStartX - touchEndX;
    const absDiff = Math.abs(diff);
    
    if (absDiff < SWIPE_THRESHOLD) return; // Не свайп
    
    // Предотвращаем множественные срабатывания
    if (card.classList.contains('swiping')) return;
    card.classList.add('swiping');
    
    // Свайп влево (diff > 0) - неверно
    if (diff > SWIPE_THRESHOLD) {
      card.classList.add('swipe-left');
      setTimeout(() => {
        markWrong();
      }, 300);
    }
    // Свайп вправо (diff < 0) - верно
    else if (diff < -SWIPE_THRESHOLD) {
      card.classList.add('swipe-right');
      setTimeout(() => {
        markCorrect();
      }, 300);
    }
  }
}

// Hide mode
function buildHideMode() {
  updateHideMode();
}

function updateHideMode() {
  const pct = parseInt(document.getElementById('hide-slider').value);
  document.getElementById('hide-pct').textContent = pct + '%';
  renderHideMode(pct);
}

function renderHideMode(pct) {
  const t = TOPICS[currentTopic];
  const el = document.getElementById('mode-hide-content');

  el.innerHTML = t.sentences.map((s, si) => {
    const plain = s.en.replace(/<strong>/g, '').replace(/<\/strong>/g, '');
    const words = plain.split(/(\s+)/);
    let rendered = '';
    words.forEach((w, wi) => {
      if (/^\s+$/.test(w)) { rendered += w; return; }
      const hide = (Math.abs(hashInt(si * 1000 + wi)) % 100) < pct;
      if (hide) {
        const width = Math.max(50, w.length * 8);
        rendered += `<span class="hidden-word" style="min-width:${width}px" onclick="this.classList.toggle('revealed')">${w}</span>`;
      } else {
        // highlight terms that were bold
        if (s.en.includes(`<strong>${w}</strong>`) || s.en.includes(`<strong>${w} `)) {
          rendered += `<strong style="color:var(--accent)">${w}</strong>`;
        } else {
          rendered += w;
        }
      }
    });
    return `
      <div class="sentence-item" style="cursor:default">
        <div class="s-num">${si+1}</div>
        <div class="s-content">
          <div class="s-en" style="font-size:14px;line-height:1.7">${rendered}</div>
        </div>
      </div>`;
  }).join('');
}

function hashInt(n) {
  let h = n;
  h = ((h >> 16) ^ h) * 0x45d9f3b;
  h = ((h >> 16) ^ h) * 0x45d9f3b;
  h = (h >> 16) ^ h;
  return h;
}

function revealAll() {
  document.querySelectorAll('.hidden-word').forEach(el => el.classList.add('revealed'));
}

function switchMode(mode, tabEl) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  if (tabEl) tabEl.classList.add('active');

  document.getElementById('mode-read').style.display = mode === 'read' ? '' : 'none';
  document.getElementById('mode-cards').style.display = mode === 'cards' ? '' : 'none';
  document.getElementById('mode-hide').style.display = mode === 'hide' ? '' : 'none';

  if (mode === 'cards') buildCardsMode();
  if (mode === 'hide') buildHideMode();
}

// Random
function rollDice() {
  const btn = document.getElementById('dice-btn');
  btn.classList.add('spinning');
  setTimeout(() => btn.classList.remove('spinning'), 400);

  randomTopicId = Math.floor(Math.random() * TOPICS.length);
  const t = TOPICS[randomTopicId];

  document.getElementById('random-topic-name').textContent = t.emoji + ' ' + t.title;
  document.getElementById('random-result').style.display = 'block';
  document.getElementById('random-hint').style.display = 'none';
}

function goToRandomTopic() {
  if (randomTopicId !== null) openTopic(randomTopicId);
}

// Navigation
function showScreen(id, navEl) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');

  if (navEl) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    navEl.classList.add('active');
  }
}

function goHome() {
  showScreen('home', document.querySelectorAll('.nav-item')[0]);
}

buildHome();
